<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Behalte auf Basis der Spieltheorie (Tit for Tat) den Überblick, mit wem du wo stehst." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gambit" />
  <title>Gambit — Beziehungsstrategie</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="icon-192.png" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo-mark" src="icon-192.png" alt="Gambit" width="38" height="38" />
      <div class="brand-text">
        <h1>Gambit</h1>
        <p>Wo stehe ich mit wem?</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="menuBtn" class="icon-btn" aria-label="Menü" title="Menü">⋯</button>
    </div>
  </header>

  <main id="listView" class="view">
    <div class="list-head">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Person suchen…" autocomplete="off" />
      </div>
    </div>
    <ul id="peopleList" class="people"></ul>
    <div id="emptyState" class="empty hidden">
      <div class="empty-emoji">🧭</div>
      <h2>Noch niemand angelegt</h2>
      <p>Lege deine erste Person an und dokumentiere, wie eure Zusammenarbeit läuft. Gambit schlägt dir den nächsten Zug vor.</p>
      <button class="btn primary" data-add>Erste Person anlegen</button>
    </div>
  </main>

  <button id="fab" class="fab" aria-label="Person hinzufügen" title="Person hinzufügen">＋</button>

  <!-- Detail-Ansicht -->
  <section id="detailView" class="view detail hidden" aria-hidden="true"></section>

  <!-- Modal-Container -->
  <div id="modalRoot"></div>

  <script src="strategies.js"></script>
  <script src="app.js"></script>
</body>
</html>
